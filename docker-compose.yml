services:
  db:
    image: postgres:16-alpine
    container_name: streaks-postgres
    restart: always
    environment:
      POSTGRES_DB: streaks_db
      POSTGRES_USER: streaks_user
      POSTGRES_PASSWORD: streaks_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streaks_user -d streaks_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streaks-api
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/streaks_db
      DB_USERNAME: streaks_user
      DB_PASSWORD: streaks_password
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION_MS: 86400000
      PORT: 8080

volumes:
  postgres_data:
